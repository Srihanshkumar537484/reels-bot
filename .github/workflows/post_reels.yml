name: Post Reels

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      list_only:
        description: "Sirf accounts list dikhao, post mat karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post reels
        env:
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          ONLY_ACCOUNTS: ${{ vars.ONLY_ACCOUNTS }}
          LIST_ONLY: ${{ inputs.list_only }}
          REELS_PER_RUN: "2"
        run: python post_reels.py

      - name: Save state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update posting state"
            git pull --rebase
            git push
          fi

name: Post Reels

on:
  schedule:
    - cron: "0 3 * * *"     # 8:30 AM IST pe shuru, script 9:00-10:00 AM IST me post karega
    - cron: "0 14 * * *"    # 7:30 PM IST pe shuru, script 8:00-9:00 PM IST me post karega
  workflow_dispatch:         # manual test: turant post karta hai
    inputs:
      list_only:
        description: "Sirf accounts list dikhao, post mat karo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: post-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post reels
        env:
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          ONLY_ACCOUNTS: ${{ vars.ONLY_ACCOUNTS }}
          LIST_ONLY: ${{ inputs.list_only }}
          REELS_PER_RUN: "2"
          WINDOW_START: ${{ github.event.schedule == '0 3 * * *' && '09:00' || (github.event.schedule == '0 14 * * *' && '20:00' || '') }}
          WINDOW_END: ${{ github.event.schedule == '0 3 * * *' && '10:00' || (github.event.schedule == '0 14 * * *' && '21:00' || '') }}
        run: python post_reels.py
